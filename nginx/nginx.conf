worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    log_format payflow '$remote_addr $request_id "$request" $status '
                       '$body_bytes_sent ${request_time}s "$http_user_agent"';
    access_log /var/log/nginx/access.log payflow;

    sendfile on;
    tcp_nopush on;
    server_tokens off;

    gzip on;
    gzip_types application/json application/problem+json text/plain;
    gzip_min_length 1024;

    # Грубый рубеж по адресу: флуд отсекается до gateway. Точное ведро на покупателя — там.
    limit_req_zone $binary_remote_addr zone=perimeter:10m rate=100r/s;
    limit_req_status 429;

    # Медленный клиент не должен занимать воркер бесконечно (slow loris).
    client_body_timeout 10s;
    client_header_timeout 10s;
    client_max_body_size 1m;

    upstream gateway {
        server gateway:8080;
    }

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;

        location / {
            limit_req zone=perimeter burst=200 nodelay;

            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id      $request_id;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }
    }
}
