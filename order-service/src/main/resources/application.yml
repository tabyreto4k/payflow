spring:
  application:
    name: order-service
  datasource:
    url: ${ORDERS_DB_URL:jdbc:postgresql://localhost:5432/orders_db}
    username: ${POSTGRES_ORDERS_USER:orders_user}
    password: ${POSTGRES_ORDERS_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # acks=all + идемпотентность: подтверждение только когда запись легла на все реплики in-sync,
      # а повтор при ретрае не породит дубль в партиции.
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 15000
        request.timeout.ms: 5000
    consumer:
      group-id: ${KAFKA_GROUP_ID:order-service}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
    listener:
      ack-mode: record
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
    # Гистограмма по HTTP нужна дашборду: без бакетов p99 не посчитать, из таймера
    # приезжают только count и sum.
    distribution:
      percentiles-histogram:
        http.server.requests: true

payflow:
  jwt:
    # Секрет общий с gateway; дефолта нет намеренно — сервис не должен подниматься с ключом из кода.
    secret: ${JWT_SECRET}
    access-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-ttl: ${JWT_REFRESH_TTL:7d}
  outbox:
    batch-size: ${OUTBOX_BATCH_SIZE:100}
    poll-interval: ${OUTBOX_POLL_INTERVAL:PT0.2S}

logging:
  level:
    root: INFO
