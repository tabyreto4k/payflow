spring:
  application:
    name: notification-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      # Продюсер нужен ровно для одного: переложить неотправляемое сообщение в DLT.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      group-id: ${KAFKA_GROUP_ID:notification-service}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Оффсет сдвигается после возврата из слушателя: письмо уходит раньше коммита.
      enable-auto-commit: false
      auto-offset-reset: earliest
    listener:
      ack-mode: record
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      # MailHog слушает голый SMTP: ни аутентификации, ни TLS у него нет.
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

payflow:
  mail:
    from: ${MAIL_FROM:no-reply@payflow.ru}
  dedup:
    # Сутки: повторная доставка приезжает минутами, а не днями, а ключам незачем жить вечно.
    ttl: ${DEDUP_TTL:PT24H}
    key-prefix: ${DEDUP_KEY_PREFIX:notification:event:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
