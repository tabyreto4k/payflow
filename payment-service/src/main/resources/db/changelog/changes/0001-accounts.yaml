databaseChangeLog:
  - changeSet:
      id: 0001-accounts
      author: payflow
      logicalFilePath: db/changelog/changes/0001-accounts.yaml
      changes:
        - createTable:
            tableName: accounts
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: customer_id
                  type: uuid
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_accounts_customer_id
              - column:
                  name: balance
                  type: numeric(19, 2)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
        # Последний рубеж инварианта «баланс не уходит в минус»: даже кривой UPDATE в обход
        # доменной модели упрётся в базу.
        - sql:
            sql: ALTER TABLE accounts ADD CONSTRAINT ck_accounts_balance_non_negative CHECK (balance >= 0)
            rollback: ALTER TABLE accounts DROP CONSTRAINT ck_accounts_balance_non_negative
