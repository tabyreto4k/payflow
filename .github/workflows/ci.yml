name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Форматирование и линт — до тестов: падает быстрее и на очевидном.
      - name: Format & lint
        run: ./gradlew spotlessCheck checkstyleMain checkstyleTest checkstyleIntegrationTest

      - name: Unit tests
        run: ./gradlew test

      # На ubuntu-раннере есть Docker, поэтому Testcontainers работают как есть.
      # `build` доводит до конца: интеграционные тесты и порог покрытия по обоим прогонам.
      - name: Build, integration tests & coverage
        run: ./gradlew build

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/reports/jacoco/
          retention-days: 7

  e2e:
    name: e2e saga (compose)
    runs-on: ubuntu-latest
    # Отдельной джобой, а не шагом в build: сборка двух образов занимает минуты, и быстрый
    # фидбэк по линту и тестам не должен её ждать.
    steps:
      - uses: actions/checkout@v4

      # Секретов в сценарии нет: это локальный стенд, поднимаемый на время прогона.
      - name: Prepare env
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_SUPERUSER_PASSWORD=$/POSTGRES_SUPERUSER_PASSWORD=postgres/' .env
          sed -i 's/^POSTGRES_ORDERS_PASSWORD=$/POSTGRES_ORDERS_PASSWORD=orders_pwd/' .env
          sed -i 's/^POSTGRES_PAYMENTS_PASSWORD=$/POSTGRES_PAYMENTS_PASSWORD=payments_pwd/' .env
          sed -i 's/^GRAFANA_ADMIN_PASSWORD=$/GRAFANA_ADMIN_PASSWORD=admin/' .env
          sed -i 's/^JWT_SECRET=$/JWT_SECRET=ci-only-signing-key-32-bytes-min/' .env

      - name: Self-signed certificate for nginx
        run: ./scripts/gen-certs.sh

      - name: Start the stack
        run: docker compose up -d --wait

      - name: Saga end to end
        run: ./scripts/e2e-saga.sh

      - name: Service logs on failure
        if: failure()
        run: docker compose logs --tail 200 nginx gateway order-service payment-service

      - name: Tear down
        if: always()
        run: docker compose down -v
