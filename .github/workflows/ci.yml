name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Форматирование и линт — до тестов: падает быстрее и на очевидном.
      - name: Format & lint
        run: ./gradlew spotlessCheck checkstyleMain checkstyleTest checkstyleIntegrationTest

      - name: Unit tests
        run: ./gradlew test

      # На ubuntu-раннере есть Docker, поэтому Testcontainers работают как есть.
      # `build` доводит до конца: интеграционные тесты и порог покрытия по обоим прогонам.
      - name: Build, integration tests & coverage
        run: ./gradlew build

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/reports/jacoco/
          retention-days: 7
