spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          # Ограничитель общий для всех маршрутов, включая /auth: перебор паролей — тоже трафик.
          default-filters:
            - name: RequestRateLimiter
              args:
                key-resolver: '#{@customerKeyResolver}'
                redis-rate-limiter.replenishRate: ${RATE_LIMIT_REPLENISH_RATE:20}
                redis-rate-limiter.burstCapacity: ${RATE_LIMIT_BURST_CAPACITY:40}
          routes:
            - id: auth
              uri: ${ORDER_SERVICE_URI:http://localhost:8080}
              predicates:
                - Path=/api/v1/auth/**
            - id: orders
              uri: ${ORDER_SERVICE_URI:http://localhost:8080}
              predicates:
                - Path=/api/v1/orders/**
            - id: accounts
              uri: ${PAYMENT_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/accounts/**
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

payflow:
  jwt:
    # Тот же ключ, что у order-service; дефолта нет намеренно.
    secret: ${JWT_SECRET}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
    # Гистограмма по HTTP нужна дашборду: без бакетов p99 не посчитать, из таймера
    # приезжают только count и sum.
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  # Логи структурные (ECS): их читает не человек в консоли, а сборщик. MDC уезжает в JSON полями,
  # поэтому correlationId сразу становится фильтром, а не поводом писать регулярку.
  structured:
    format:
      console: ecs
  level:
    root: INFO
